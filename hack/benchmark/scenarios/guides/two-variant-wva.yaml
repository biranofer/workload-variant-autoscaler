# TWO-VARIANT WVA SCENARIO (Topology B — one shared EPP)
#
# Deploys the primary variant (cost 10.0) of unsloth/Meta-Llama-3.1-8B-Instruct as a
# standard single-stack benchmark. A second variant at a lower cost (default
# 5.0) is then layered on top via `make benchmark-add-variant`.
#
# Both variants register their pods into the SAME InferencePool / EPP so the
# WVA saturation solver can compare their costs under a unified queue-depth
# signal and scale the more efficient variant first.
#
# Autoscaling uses KEDA ScaledObjects with the llm-d.ai/managed annotation.
# WVA discovers both ScaledObjects and drives them via wva_desired_replicas.
# `make benchmark-add-variant` creates ScaledObjects for both the primary
# (on first run) and the added variant.
#
# Topology:
#
#         +--------- Gateway -------------------------+
#         |  HTTPRoute → InferencePool (one EPP)      |
#         +--------------------------------------------+
#                              |
#               +--------------+--------------+
#               |                             |
#     +---------+--------+       +------------+-----+
#     | vLLM decode      |       | vLLM decode      |
#     | primary (cost 10)|       | variant  (cost 5)|
#     | ScaledObject     |       | ScaledObject     |
#     +------------------+       +------------------+
#                   ^                       ^
#                   +------- WVA (1) -------+
#                              controller
#
# How the two variants share one InferencePool
# --------------------------------------------
# The InferencePool EPP selects pods by two labels:
#   llm-d.ai/inferenceServing: "true"          (camelCase)
#   llm-d.ai/model:            <model-hash>
#
# The primary Deployment (managed by modelservice chart) also sets a third
# label on its pods: llm-d.ai/inference-serving: "true" (kebab-case), which
# is the primary's own selector discriminator.
#
# The variant Deployment created by `benchmark-add-variant` intentionally
# OMITS the kebab label but KEEPS the camelCase + model-hash labels, so:
#   - The InferencePool picks up both Deployments' pods (two labels match).
#   - The primary Deployment does not accidentally claim variant pods
#     (primary selector requires the kebab label, which variant pods lack).
#   - The variant Deployment uses wva.llmd.ai/variant=<suffix> as a unique
#     discriminator in its own pod selector.
#
# Both ScaledObjects share llm-d.ai/model-id so the WVA solver groups them
# and applies cost-weighted scaling.
#
# Running (two-step workflow):
#
#   # Step 1: stand up primary variant (cost 10.0)
#   make benchmark-standup BENCHMARK_NAMESPACE=<ns> BENCHMARK_SPEC=guides/two-variant-wva
#
#   # Step 2: add variant (cost 5.0, default) — also creates primary ScaledObject on first run
#   make benchmark-add-variant BENCHMARK_NAMESPACE=<ns>
#
#   # Run the benchmark (both variants are in the same pool)
#   make benchmark-run BENCHMARK_NAMESPACE=<ns>
#
#   # Teardown (removes all resources including added variant)
#   make benchmark-teardown BENCHMARK_NAMESPACE=<ns>

# ============================================================================
# SHARED — applied to the stack before per-stack overrides
# ============================================================================
shared:
  # --------------------------------------------------------------------------
  # DEPLOYMENT METHOD
  # --------------------------------------------------------------------------
  modelservice:
    enabled: true
  standalone:
    enabled: false

  # --------------------------------------------------------------------------
  # WVA CONTROLLER — installed once per namespace; per-stack scaling intent
  # (variantAutoscaling, hpa) lives in each stack's wva: block below.
  # --------------------------------------------------------------------------
  wva:
    enabled: true
    wellLitPath: inference-scheduling
    namespace: ""
    image:
      repository: ghcr.io/biranofer/llm-d-workload-variant-autoscaler
      tag: nightly-73e1548b
    replicaCount: 1
    controller:
      enabled: true
    namespaceScoped: true
    metrics:
      enabled: true
      port: 8443
      secure: true
    prometheus:
      baseUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local
      port: 9091
    # Enable the WVA-side ServiceMonitor that propagates the `llm-d.ai/variant`
    # pod label into scraped metrics as `llm_d_ai_variant`. Required by PR #1145
    # for the V2 main path: without this relabeling, vllm:cache_config_info
    # arrives in Prometheus with no variant label, the WVA collector can't map
    # the row to a VariantAutoscaling, TotalKvCapacityTokens stays 0, and the
    # analyzer falls into computeReplicaCapacityFallback (which uses the
    # per-step batch budget — wrong dimension, ~50× under-states real KV).
    vllmService:
      enabled: true

  # NOTE: deliberately NOT setting modelArtifacts.extraLabels["llm-d.ai/variant"]
  # here. WVA's collector (buildInstanceKey in internal/collector/replica_metrics.go)
  # trusts this label as the pod's VariantAutoscaling name whenever it's
  # present -- it only falls back to the correct owner-chain lookup when the
  # label is *missing*. The correct value depends on the runtime-resolved
  # ScaledObject name ("<deployment>-scaler"), which isn't knowable at scenario-
  # render time (and is model-hash-dependent), so a hardcoded value here would
  # almost certainly be wrong and would silently drop this pod's demand
  # contribution from the analyzer -- root-caused 2026-07-25/26 (a previous
  # hardcoded value here was believed harmless/"metadata only" but wasn't;
  # see docs/developer-guide/two-variant-wva-benchmark.md history). Leaving
  # the label unset lets `make benchmark-add-variant` (add_variant.py's
  # fix_variant_pod_label()) set it correctly post-standup, once the primary
  # ScaledObject's real name is known.

  chartVersions:
    wva: 0.8.0-rc5
    prometheusAdapter: 5.2.0

  # --------------------------------------------------------------------------
  # IMAGE OVERRIDES — pin vllm-openai to v0.14.0 (newer than the v0.9.2
  # default) so the model server emits vllm:cache_config_info, allowing the
  # WVA saturation-V2 analyzer to use real KV-memory capacity instead of
  # the per-step batch budget fallback.
  # --------------------------------------------------------------------------
  images:
    vllmOpenai:
      repository: docker.io/vllm/vllm-openai
      tag: v0.14.0

  # --------------------------------------------------------------------------
  # EPP PLUGIN CONFIG — flowControl feature gate required for WVA queue-depth
  # driven scaling signal.
  #
  # NOTE: the key here is `router.epp.*`, not a top-level `inferenceExtension:`
  # block. `inferenceExtension.pluginsConfigFile`/`pluginsCustomConfig` is the
  # naming convention llm-d-benchmark's "convert-guide" skill uses for its
  # GUIDE input format (mirroring the upstream gateway-api-inference-extension
  # chart's own values.yaml) -- it is NOT a key a benchmark SCENARIO file
  # itself is templated against. The scenario schema's real key, confirmed by
  # reading the rendered config.yaml and llm-d-benchmark's own
  # workload/README.md ("Sweeping EPP plugins config (router.epp.pluginsConfigFile)"),
  # is `router.epp.pluginsConfigFile`/`pluginsCustomConfig`. Using the wrong
  # (guide-format) key here silently no-oped: it landed in the rendered
  # config.yaml as an unused top-level `inferenceExtension:` key, while
  # `router.epp.pluginsConfigFile` stayed at its chart default
  # (`default-plugins.yaml`, no `featureGates: [flowControl]`) -- meaning this
  # scenario's `flowControl` gate has never actually been enabled by this file,
  # in any run, since this scenario was first authored -- root-caused 2026-07-26.
  # --------------------------------------------------------------------------
  router:
    epp:
      pluginsConfigFile: "wva-plugins.yaml"
      pluginsCustomConfig:
        wva-plugins.yaml: |
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          featureGates:
            - flowControl
          plugins:
            - type: queue-scorer
            - type: kv-cache-utilization-scorer
            - type: prefix-cache-scorer
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3

  # --------------------------------------------------------------------------
  # VLLM COMMON
  # --------------------------------------------------------------------------
  vllmCommon:
    kvTransfer:
      enabled: true
      connector: NixlConnector
      role: kv_both
    flags:
      enforceEager: true
      disableLogRequests: true
      disableUvicornAccessLog: true
      allowLongMaxModelLen: "1"
      serverDevMode: "1"
    volumes:
      - name: shared-config
        type: emptyDir
        emptyDir: {}
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: shared-config
        mountPath: /shared-config

  # --------------------------------------------------------------------------
  # PREFILL / DECODE defaults
  # --------------------------------------------------------------------------
  prefill:
    enabled: false
    replicas: 0

  decode:
    initContainers:
      - name: preprocess
        imageKey: benchmark
        imagePullPolicy: Always
        command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
        volumeMounts:
          - name: shared-config
            mountPath: /shared-config
    parallelism:
      tensor: 2
      data: 1
      dataLocal: 1
      workers: 1
    extraEnvVars: []
    extraContainerConfig:
      ports:
        - containerPort: 5557
          protocol: TCP
        - containerPort: 8200
          name: metrics
          protocol: TCP
      securityContext:
        capabilities:
          add:
            - "IPC_LOCK"
            - "SYS_RAWIO"
        runAsGroup: 0
        runAsUser: 0
      imagePullPolicy: Always
    additionalVolumeMounts: []
    additionalVolumes: []
    probes:
      startup:
        path: /v1/models
        failureThreshold: 60
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
      liveness:
        path: /health
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5
      readiness:
        path: /v1/models
        failureThreshold: 3
        periodSeconds: 5
        timeoutSeconds: 2
    monitoring:
      podmonitor:
        enabled: true
        portName: metrics
        path: /metrics
        interval: 30s
        labels:
          release: llmd

  workDir: "~/data/two-variant-wva"
  harness:
    name: inference-perf
    experimentProfile: prefill_heavy_4k1k_2_10.yaml
    # Default harness pod memory (32Gi) OOMKilled mid-run on this workload's
    # 1000-token mean output — the first run of this repo's benchmarks at
    # that output length (prior workloads topped out at 800). Bumped for
    # headroom; nodes have ~2TB allocatable so this costs nothing.
    resources:
      cpu: 16
      memory: 64Gi
    # Prevent the entrypoint's 3-attempt retry loop from re-running the whole
    # workload on transient per-request errors, which would contaminate
    # capture windows and overwrite run_metadata.yaml's timestamps.
    extraEnvVars:
      - name: LLMDBENCH_RUN_EXPERIMENT_HARNESS_MAX_TRIES
        value: "1"

  storage:
    modelPvc:
      size: 32Gi


# ============================================================================
# SCENARIO — primary variant (high-cost, cost 10.0)
#
# This standup deploys the primary variant only. Run `make benchmark-add-variant`
# afterwards to add the secondary variant at a lower cost.
# ============================================================================
scenario:
  - name: "llama-8b"

    # Default model is an INSTRUCT (chat-templated) model. On llm-d-benchmark
    # >= v0.7.0 the decode image ships transformers >= 4.44, which rejects a
    # model whose tokenizer defines no chat template (i.e. base models) with
    # ChatTemplateResolutionError. Override with -m / BENCHMARK_MODEL_ID, but
    # only with another chat-templated model (or supply --chat-template).
    model:
      name: unsloth/Meta-Llama-3.1-8B-Instruct
      shortName: unsloth-meta-llama-3-1-8b-instruct
      path: models/unsloth/Meta-Llama-3.1-8B-Instruct
      huggingfaceId: unsloth/Meta-Llama-3.1-8B-Instruct
      size: 32Gi
      maxModelLen: 8192
      blockSize: 64
      gpuMemoryUtilization: 0.85

    wva:
      # Autoscaling objects (ScaledObjects) are created by `make benchmark-add-variant`
      # via add_variant.py, not by the benchmark harness. This keeps both the primary
      # and variant ScaledObjects consistent and avoids the deprecated
      # VariantAutoscaling CRD path.
      variantAutoscaling:
        enabled: false
      hpa:
        enabled: false

    decode:
      replicas: 1
      resources:
        limits:
          memory: 48Gi
          cpu: "16"
        requests:
          memory: 48Gi
          cpu: "16"
