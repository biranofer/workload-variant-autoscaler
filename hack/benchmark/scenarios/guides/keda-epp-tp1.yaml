# KEDA-EPP TP=1 SCENARIO — single-variant, KEDA-only autoscaling
#
# Deploys unsloth/Meta-Llama-3.1-8B-Instruct as a single TP=1 decode
# deployment. No WVA is installed; autoscaling is handled externally by
# a KEDA ScaledObject (apply hack/benchmark/scenarios/keda-epp/scaledobject.yaml
# after standup).
#
# Topology:
#
#   Gateway → InferencePool (EPP with flowControl)
#                   |
#           vLLM decode TP=1
#           KEDA ScaledObject (applied separately)
#
# Usage:
#
#   # Deploy
#   make benchmark-standup BENCHMARK_NAMESPACE=biran BENCHMARK_SPEC=guides/keda-epp-tp1
#
#   # Apply KEDA ScaledObject (no WVA; scales on EPP queue + running-request metrics)
#   kubectl apply -f hack/benchmark/scenarios/keda-epp/scaledobject.yaml
#
#   # Run prefill-heavy workload
#   make benchmark-run BENCHMARK_NAMESPACE=biran BENCHMARK_SPEC=guides/keda-epp-tp1 \
#     BENCHMARK_HARNESS=inference-perf BENCHMARK_WORKLOAD=prefill_heavy_4k_2_6.yaml
#
#   # Wait for replicas to scale back to 1 (~10 min cooldown), then run decode-heavy
#   make benchmark-run BENCHMARK_NAMESPACE=biran BENCHMARK_SPEC=guides/keda-epp-tp1 \
#     BENCHMARK_HARNESS=inference-perf BENCHMARK_WORKLOAD=decode_heavy_4k_2_6.yaml
#
#   # Teardown
#   make benchmark-teardown BENCHMARK_NAMESPACE=biran BENCHMARK_SPEC=guides/keda-epp-tp1

# ============================================================================
# SHARED — applied to the stack before per-stack overrides
# ============================================================================
shared:
  # --------------------------------------------------------------------------
  # DEPLOYMENT METHOD
  # --------------------------------------------------------------------------
  modelservice:
    enabled: true
  standalone:
    enabled: false

  # --------------------------------------------------------------------------
  # IMAGE OVERRIDES — pin vllm-openai to v0.14.0 so the model server emits
  # vllm:cache_config_info (required by WVA Sat-2 in the comparison runs;
  # keep pinned here for consistency).
  # --------------------------------------------------------------------------
  images:
    vllmOpenai:
      repository: docker.io/vllm/vllm-openai
      tag: v0.14.0

  # --------------------------------------------------------------------------
  # EPP PLUGIN CONFIG — flowControl feature gate required for the
  # inference_extension_flow_control_queue_size metric used by the KEDA
  # ScaledObject trigger.
  #
  # NOTE: key is `router.epp.*`, not a top-level `inferenceExtension:` block --
  # same wrong-key mistake as two-variant-wva.yaml, root-caused 2026-07-26.
  # `inferenceExtension.pluginsConfigFile`/`pluginsCustomConfig` is
  # llm-d-benchmark's GUIDE input-format naming (its "convert-guide" skill),
  # not a key a benchmark SCENARIO file is templated against. The real key is
  # `router.epp.pluginsConfigFile`/`pluginsCustomConfig` (confirmed against
  # the rendered config.yaml and llm-d-benchmark's workload/README.md).
  # --------------------------------------------------------------------------
  router:
    epp:
      pluginsConfigFile: "keda-epp-plugins.yaml"
      pluginsCustomConfig:
        keda-epp-plugins.yaml: |
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          featureGates:
            - flowControl
          plugins:
            - type: queue-scorer
            - type: kv-cache-utilization-scorer
            - type: prefix-cache-scorer
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3

  # --------------------------------------------------------------------------
  # VLLM COMMON
  # --------------------------------------------------------------------------
  vllmCommon:
    kvTransfer:
      enabled: true
      connector: NixlConnector
      role: kv_both
    flags:
      enforceEager: true
      disableLogRequests: true
      disableUvicornAccessLog: true
      allowLongMaxModelLen: "1"
      serverDevMode: "1"
    volumes:
      - name: shared-config
        type: emptyDir
        emptyDir: {}
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: shared-config
        mountPath: /shared-config

  # --------------------------------------------------------------------------
  # PREFILL / DECODE defaults (TP=1, single GPU per pod)
  # --------------------------------------------------------------------------
  prefill:
    enabled: false
    replicas: 0

  decode:
    initContainers:
      - name: preprocess
        imageKey: benchmark
        imagePullPolicy: Always
        command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
        volumeMounts:
          - name: shared-config
            mountPath: /shared-config
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    extraEnvVars: []
    extraContainerConfig:
      ports:
        - containerPort: 5557
          protocol: TCP
        - containerPort: 8200
          name: metrics
          protocol: TCP
      securityContext:
        capabilities:
          add:
            - "IPC_LOCK"
            - "SYS_RAWIO"
        runAsGroup: 0
        runAsUser: 0
      imagePullPolicy: Always
    additionalVolumeMounts: []
    additionalVolumes: []
    probes:
      startup:
        path: /v1/models
        failureThreshold: 60
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
      liveness:
        path: /health
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5
      readiness:
        path: /v1/models
        failureThreshold: 3
        periodSeconds: 5
        timeoutSeconds: 2
    monitoring:
      podmonitor:
        enabled: true
        portName: metrics
        path: /metrics
        interval: 30s
        labels:
          release: llmd

  workDir: "~/data/keda-epp-tp1"
  harness:
    name: inference-perf
    experimentProfile: prefill_heavy_4k_2_6.yaml
    # Default harness pod memory (32Gi) OOMKilled mid-run on the
    # prefill_heavy_4k1k_* workloads' 1000-token mean output (same issue
    # documented in two-variant-wva.yaml). This leg happened to complete
    # without hitting it, but the risk is latent — bump for headroom; nodes
    # have ~2TB allocatable so this costs nothing.
    resources:
      cpu: 16
      memory: 64Gi

  storage:
    modelPvc:
      size: 32Gi

# ============================================================================
# SCENARIO — single TP=1 variant
# ============================================================================
scenario:
  - name: "llama-8b-tp1"

    model:
      name: unsloth/Meta-Llama-3.1-8B-Instruct
      shortName: unsloth-meta-llama-3-1-8b-instruct
      path: models/unsloth/Meta-Llama-3.1-8B-Instruct
      huggingfaceId: unsloth/Meta-Llama-3.1-8B-Instruct
      size: 32Gi
      maxModelLen: 8192
      blockSize: 64
      gpuMemoryUtilization: 0.85

    wva:
      variantAutoscaling:
        enabled: false
      hpa:
        enabled: false

    decode:
      replicas: 1
      resources:
        limits:
          memory: 32Gi
          cpu: "8"
        requests:
          memory: 32Gi
          cpu: "8"
